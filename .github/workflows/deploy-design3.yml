name: Deploy design3

on:
  push:
    branches: [main]
    paths:
      - "src/design3/**"
      - ".github/workflows/deploy-design3.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the publish list
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            src/design3/404.html \
            src/design3/cv.html \
            src/design3/cv.css \
            src/design3/ddc.jpg \
            src/design3/index.html \
            src/design3/about.html \
            src/design3/work \
            src/design3/css \
            src/design3/js \
            src/design3/fonts \
            "$RUNNER_TEMP/site/"
          mkdir -p "$RUNNER_TEMP/site/img"
          rsync -a \
            src/design3/img/favicon.svg \
            src/design3/img/og.jpg \
            src/design3/img/annotator-tools.webp \
            src/design3/img/annotator-canvas.webp \
            src/design3/img/annotator-editor-detail.webp \
            src/design3/img/ml-readiness.webp \
            src/design3/img/palmist-results.webp \
            src/design3/img/palmist-upload.webp \
            "$RUNNER_TEMP/site/img/"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
